<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSE_D HQ — Notion-style Student Workspace (Demo)</title>
  <style>
    :root{
      --bg:#ffffff; --panel:#fbfdff; --muted:#6b7280; --accent:#0ea5a4; --accent2:#06b6d4; --text:#0f172a; --glass:rgba(255,255,255,0.6);
      --radius:12px;
    }
    body.dark{
      --bg:#071227; --panel:#071227; --muted:#a7b4c3; --accent:#34d399; --accent2:#06b6d4; --text:#e6eef6;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:var(--bg); color:var(--text);
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }

    /* layout */
    .app{display:flex;min-height:100vh}
    .leftbar{
      width:260px; padding:20px; border-right:1px solid rgba(15,23,42,0.06);
      background:linear-gradient(180deg,var(--panel),rgba(255,255,255,0.02));
      transition:transform .22s ease, box-shadow .22s;
    }
    .leftbar.closed{transform:translateX(-112%)}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:white;font-weight:800;box-shadow:0 8px 30px rgba(6,182,212,0.08)}
    .title{font-weight:700}
    .muted{color:var(--muted);font-size:13px}
    .pages{display:flex;flex-direction:column;gap:8px;margin-top:6px}
    .page-btn{
      display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;text-align:left;transition:background .12s,color .12s;
    }
    .page-btn.active{background:rgba(14,165,164,0.08);color:var(--text);font-weight:600}
    .left-footer{position:fixed;bottom:18px;left:20px;right:20px;display:flex;gap:8px}
    .ghost{background:transparent;border:1px solid rgba(15,23,42,0.06);padding:8px;border-radius:10px}
    .workspace{flex:1;padding:28px;transition:margin-left .2s}
    .ws-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
    .ws-breadcrumbs{font-size:14px;color:var(--muted)}
    .ws-actions{display:flex;gap:10px;align-items:center}
    .btn{padding:8px 12px;border-radius:10px;border:0;cursor:pointer;background:transparent}
    .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:white;box-shadow:0 8px 30px rgba(6,182,212,0.08)}
    .btn.small{padding:6px 10px;font-size:13px}
    .btn.tiny{padding:4px 6px;font-size:12px}
    #pageContent{min-height:60vh;padding:22px;border-radius:14px;background:linear-gradient(180deg,rgba(14,165,164,0.02),transparent);outline:none;transition:box-shadow .12s}
    #pageContent:focus{box-shadow:0 10px 40px rgba(6,182,212,0.05)}
    /* Blocks */
    .block{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid rgba(2,6,23,0.04);transition:box-shadow .12s,transform .12s}
    .block + .block{margin-top:10px}
    .block:hover{box-shadow:0 12px 30px rgba(2,6,23,0.06);transform:translateY(-6px)}
    .left-handle{color:var(--muted);cursor:grab;padding-top:6px;user-select:none}
    .content{flex:1;min-height:36px;outline:none;white-space:pre-wrap}
    .content:empty:before{content:"Type '/' for commands — e.g. /h1, /todo, /code";color:var(--muted);font-size:13px}
    .meta{display:flex;gap:8px;margin-left:8px}
    .icon{opacity:.9}
    .block.dragging{opacity:.6;transform:scale(.98)}
    .block.placeholder{border:2px dashed rgba(6,182,212,0.18);background:transparent}

    /* footer */
    .ws-foot{margin-top:18px;color:var(--muted);font-size:13px}

    /* mobile */
    @media(max-width:920px){
      .leftbar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-112%);box-shadow:0 30px 80px rgba(2,6,23,0.12)}
      .leftbar.open{transform:none}
      .workspace{padding:18px}
    }

    /* small polish */
    .brand .subtitle{font-size:13px;color:var(--muted)}
    .page-actions{display:flex;gap:8px;align-items:center}
    .btn.ghost{border:1px solid rgba(15,23,42,0.06);padding:8px;border-radius:10px}
    .hidden{display:none}
    /* subtle animation for new block */
    .block.enter{animation:popIn .22s ease}
    @keyframes popIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

    /* export modal */
    .modal{
      position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);padding:18px;border-radius:12px;box-shadow:0 30px 80px rgba(2,6,23,0.12);z-index:200;width:min(720px,92vw);
    }
    .overlay{position:fixed;inset:0;background:rgba(2,6,23,0.28);z-index:190}

    /* small utilities */
    .muted{color:var(--muted)}
    input[type="text"], input[type="search"]{padding:8px 10px;border-radius:8px;border:1px solid rgba(15,23,42,0.06);background:transparent}
    .tiny-ico{font-size:14px}
  </style>
</head>
<body class="light">
  <div class="app" id="app">
    <aside class="leftbar" id="leftbar" aria-label="Pages">
      <div class="brand">
        <div class="logo" aria-hidden>CD</div>
        <div>
          <div class="title">CSE_D HQ</div>
          <div class="subtitle muted">Notion-style Class Workspace</div>
        </div>
      </div>

      <div class="pages" id="pagesList" aria-label="Page list">
        <!-- page buttons inserted here -->
      </div>

      <div class="left-footer">
        <button id="newPage" class="ghost" title="Create new page">+ Page</button>
        <button id="themeToggle" class="ghost" title="Toggle theme">Dark</button>
      </div>
    </aside>

    <main class="workspace" role="main">
      <header class="ws-top">
        <div class="ws-breadcrumbs">CSE_D HQ / <span id="pageTitle">Home</span></div>
        <div class="ws-actions">
          <button id="shareBtn" class="btn small">Share</button>
          <button id="addBlock" class="btn primary">+ Block</button>
          <button id="toggleSidebar" class="btn ghost" title="Toggle sidebar">☰</button>
        </div>
      </header>

      <section id="pageContent" tabindex="0" aria-label="Page content">
        <!-- blocks will be injected here -->
      </section>

      <footer class="ws-foot muted">Demo • Notion-style blocks • Class: <strong>CSE_D HQ</strong></footer>
    </main>
  </div>

  <!-- template -->
  <template id="blockTemplate">
    <article class="block" draggable="true">
      <div class="left-handle" aria-hidden>⋮⋮</div>
      <div class="content" contenteditable="true" role="textbox" aria-multiline="true">New block — double-click to edit</div>
      <div class="meta">
        <button class="btn tiny action save" title="Save">Save</button>
        <button class="btn tiny action del" title="Delete">Delete</button>
      </div>
    </article>
  </template>

  <script>
    (function(){
      // elements
      const leftbar = document.getElementById('leftbar');
      const pagesList = document.getElementById('pagesList');
      const toggleSidebar = document.getElementById('toggleSidebar');
      const themeToggle = document.getElementById('themeToggle');
      const pageTitle = document.getElementById('pageTitle');
      const pageContent = document.getElementById('pageContent');
      const addBlockBtn = document.getElementById('addBlock');
      const newPageBtn = document.getElementById('newPage');
      const shareBtn = document.getElementById('shareBtn');

      // state in localStorage key
      const KEY = 'cse_notion_state_v1';

      // init default state
      let state = JSON.parse(localStorage.getItem(KEY) || 'null');
      if(!state){
        state = {
          pages: {
            home: [{ id: idGen(), text: 'Welcome to CSE_D HQ — this Notion-style workspace demo saves to your browser. Use + Block, drag to reorder, and / key to add quickly.' }],
            announcements: [],
            study: [],
            notes: [],
            placement: []
          },
          current: 'home',
          meta: { createdAt: Date.now() }
        };
        localStorage.setItem(KEY, JSON.stringify(state));
      }

      // load theme
      const savedTheme = localStorage.getItem('cse_theme');
      if(savedTheme === 'dark'){ document.body.classList.add('dark'); themeToggle.textContent = 'Light'; } else { themeToggle.textContent = 'Dark'; }

      // utility: id
      function idGen(){ return 'b_' + Math.random().toString(36).slice(2,9); }

      // render pages list
      function renderPages(){
        pagesList.innerHTML = '';
        for(const pid of Object.keys(state.pages)){
          const btn = document.createElement('button');
          btn.className = 'page-btn' + (state.current === pid ? ' active' : '');
          btn.dataset.id = pid;
          // label (human-friendly)
          const label = pid === 'home' ? 'Home' : pid === 'announcements' ? 'Announcements' : pid === 'study' ? 'Study Planner' : pid === 'notes' ? 'Notes' : pid === 'placement' ? 'Placement' : pid.replace(/_/g,' ');
          btn.innerHTML = `<span class="tiny-ico">${iconFor(pid)}</span><span style="flex:1;margin-left:6px">${label}</span>`;
          btn.addEventListener('click', ()=>{ document.querySelectorAll('.page-btn').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); state.current = pid; saveState(); renderCurrent(); });
          pagesList.appendChild(btn);
        }
      }

      // small icon helper
      function iconFor(id){
        switch(id){
          case 'home': return '🏠';
          case 'announcements': return '📢';
          case 'study': return '⏱️';
          case 'notes': return '📝';
          case 'placement': return '🎯';
          default: return '📄';
        }
      }

      // render current page blocks
      function renderCurrent(){
        pageContent.innerHTML = '';
        const cur = state.current || 'home';
        pageTitle.textContent = humanLabel(cur);
        const blocks = state.pages[cur] || [];
        blocks.forEach(b => {
          pageContent.appendChild(makeBlockElement(b));
        });
        // if empty, show a subtle placeholder block
        if(blocks.length === 0){
          const p = document.createElement('div');
          p.className = 'muted';
          p.style.padding = '18px';
          p.textContent = 'This page is empty — add blocks with + Block or press "/" to add quickly.';
          pageContent.appendChild(p);
        }
      }

      function humanLabel(id){
        if(id === 'home') return 'Home';
        if(id === 'announcements') return 'Announcements';
        if(id === 'study') return 'Study Planner';
        if(id === 'notes') return 'Notes';
        if(id === 'placement') return 'Placement';
        return id.replace(/_/g,' ');
      }

      // create block element from data
      function makeBlockElement(data){
        const tpl = document.getElementById('blockTemplate');
        const node = tpl.content.firstElementChild.cloneNode(true);
        node.classList.add('enter');
        node.dataset.id = data.id;
        const content = node.querySelector('.content');
        content.textContent = data.text;
        // events
        node.querySelector('.action.del').addEventListener('click', ()=>{ deleteBlock(data.id); });
        node.querySelector('.action.save').addEventListener('click', ()=>{ saveBlock(node); });

        // focus on double click behavior
        node.addEventListener('dblclick', ()=>{ content.focus(); document.execCommand('selectAll', false, null); });

        // drag handling
        node.addEventListener('dragstart', (e) => {
          node.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', data.id);
        });
        node.addEventListener('dragend', () => {
          node.classList.remove('dragging');
        });

        return node;
      }

      // save single block (from DOM node)
      function saveBlock(node){
        const id = node.dataset.id;
        const txt = node.querySelector('.content').textContent.trim();
        const list = state.pages[state.current];
        const idx = list.findIndex(x => x.id === id);
        if(idx > -1){
          list[idx].text = txt;
          saveState();
          renderCurrent();
        }
      }

      // delete
      function deleteBlock(id){
        state.pages[state.current] = state.pages[state.current].filter(b => b.id !== id);
        saveState();
        renderCurrent();
      }

      // add block
      function addBlock(text){
        const b = { id: idGen(), text: text || 'New block — edit me' };
        state.pages[state.current].push(b);
        saveState();
        renderCurrent();
        // focus new block quickly
        setTimeout(()=>{ const el = document.querySelector(`[data-id="${b.id}"] .content`); if(el) el.focus(); },80);
      }

      // drag-drop reordering on pageContent
      pageContent.addEventListener('dragover', (e) => {
        e.preventDefault();
        const after = getDragAfterElement(pageContent, e.clientY);
        const dragging = document.querySelector('.block.dragging');
        if(!dragging) return;
        if(after == null) pageContent.appendChild(dragging);
        else pageContent.insertBefore(dragging, after);
      });

      pageContent.addEventListener('drop', () => {
        // gather order and update state
        const ids = Array.from(pageContent.querySelectorAll('.block')).map(n => n.dataset.id);
        const newList = ids.map(id => state.pages[state.current].find(b => b.id === id) || { id, text: '' });
        state.pages[state.current] = newList;
        saveState();
        renderCurrent();
      });

      function getDragAfterElement(container, y){
        const draggableElements = [...container.querySelectorAll('.block:not(.dragging)')];
        let closest = { offset: Number.NEGATIVE_INFINITY, element: null };
        for(const child of draggableElements){
          const box = child.getBoundingClientRect();
          const offset = y - box.top - box.height / 2;
          if(offset < 0 && offset > closest.offset){
            closest = { offset, element: child };
          }
        }
        return closest.element;
      }

      // save entire state
      function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }

      // new page creation
      newPageBtn.addEventListener('click', ()=>{
        let name = prompt('New page name (e.g. Class Plan, Lab Reports)').trim();
        if(!name) return;
        const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
        if(state.pages[id]){
          alert('A page with that name already exists. Choose another name.');
          return;
        }
        state.pages[id] = [];
        state.current = id;
        saveState();
        renderPages();
        // attach click handler to new button
        const btns = pagesList.querySelectorAll('.page-btn');
        btns.forEach(b => { if(b.dataset.id === id) { b.click(); } })
      });

      // share/export (simple)
      shareBtn.addEventListener('click', ()=>{
        const cur = state.current;
        const blocks = state.pages[cur] || [];
        const text = blocks.map(b => b.text).join('\\n\\n');
        // show copy prompt
        if(navigator.clipboard){
          navigator.clipboard.writeText(text).then(()=> alert('Page content copied to clipboard (demo).'));
        } else {
          prompt('Copy page content (demo):', text);
        }
      });

      // sidebar toggle
      toggleSidebar.addEventListener('click', ()=> leftbar.classList.toggle('open'));

      // theme toggle
      themeToggle.addEventListener('click', ()=>{
        document.body.classList.toggle('dark');
        const isDark = document.body.classList.contains('dark');
        localStorage.setItem('cse_theme', isDark ? 'dark' : 'light');
        themeToggle.textContent = isDark ? 'Light' : 'Dark';
      });

      // keyboard shortcut: "/" to add block when not typing in an input
      document.addEventListener('keydown', (e)=>{
        const tag = document.activeElement.tagName;
        if(e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA' && document.querySelector(':focus') !== pageContent){
          e.preventDefault();
          addBlock('');
        }

        // ctrl+s to save current edited block
        if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's'){
          e.preventDefault();
          const focused = document.activeElement.closest && document.activeElement.closest('.block');
          if(focused) saveBlock(focused);
          saveState();
          alert('Saved (local)');
        }
      });

      // click handler to save block on blur automatically
      pageContent.addEventListener('focusout', (e)=>{
        const blk = e.target.closest && e.target.closest('.block');
        if(blk && blk.dataset.id){
          saveBlock(blk);
        }
      }, true);

      // render pages and current page initially
      renderPages();
      renderCurrent();

      // helper: expose a function to create a few sample blocks for presentation
      function seedSample(){
        const cur = state.current;
        if(!cur) return;
        if(state.pages[cur].length === 0){
          state.pages[cur].push({ id: idGen(), text: '### Class Goals\\n- Revise DS & Algo\\n- Prepare for Mock Interviews' });
          state.pages[cur].push({ id: idGen(), text: '### Announcements\\n- Quiz on Friday (Ch 1-4)' });
          state.pages[cur].push({ id: idGen(), text: '### To-do\\n[ ] Finish lab OBS\\n[ ] Book mock interview slot' });
          saveState();
          renderCurrent();
        }
      }
      // seed on first load for home
      if(state.pages.home && state.pages.home.length <= 1) setTimeout(seedSample, 300);

      // small helper to focus scrolling new blocks into view when added
      // (not necessary but nice UX)
      const observer = new MutationObserver(()=>{ const b = document.querySelector('.block.enter'); if(b){ b.classList.remove('enter'); } });
      observer.observe(pageContent, {childList:true, subtree:true});

    })();
  </script>
</body>
</html>
